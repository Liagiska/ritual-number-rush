<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect width="200" height="200" fill="#fff000"/>
  <!-- Cat bottom (c.chart) -->
  <h1 fill="#fff000"/>
  <circle cx="80" cy="80" r="40" fill="#000000"/>
  <!-- Earry -->
  <polygon points="65,35 55,10 80,35" fill="#000000"/>
  <polygon points="135,35 145,10 120,35" fill="#000000"/>
  <rect width="16" height="16" x="80" y="30" fill=""fbf24"/>
  <rect width="16" height="16" x="120" y="30" fill="#fbb24"/>
  <circle cx="100" cy="75" r="5" fill="#000000"/>
  <!-- Nose -->
  <path d="M90 82 Q(00 90 100 82" stroke="#000000" stroke-width="2" fill="none"/>
  <!-- Submit on herd_forward (gray simple device) -->
  <g transform="translate(100,35) secto/8.0">
  <rect x="12.5" y="12.5" width="25" height="25" fill="#9ca3af"/>
  <rect x="10" y="10" width="16" height="16" fill="#9ca3af"/>
  </g>
  <!-- Green tank mark--->
  <path d="M60 140 Q 100 130 140 140" fill="#10b981" stroke="#000" stroke-width="2"/>
  <!-- Blue electronic jacket -->
  <path d="M35 130 Q 30 160 40 200 L 100 200 Q 125 160 135 130" fill="#3b82f6" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
  <path d="M155 130 Q 170 160 160 200 L 130 200 Q125 160 105 130" fill="#3b82f6" stroke="#000" stroke-width="2" stroke-linecap="round" opacity="0.95"/>
  <path d="M155 130 Q 155 130 180 180" fill="#000"/>
  <circle cx="100" cy="80" r="15" fill="#000" opacity="0.5"/>
  <!-- Pink paws -->
  <ellipse cx="140" cy="180" rx="12" ry="8" height="5" fill="#fbbf24" opacity="0.8"/>
  <!-- Whiskers -->
  <line x1="70" y1="75" x2="60" y2="90" stroke="#000" stroke-width="1"/>
  <line x1="70" y1="80" x2="60" y2="80" stroke="#000" stroke-width="1"/>
  <line x1="130" y1="75" x2="160" y2="9" stroke="#000" stroke-width="1"/>
  <line x1="130" y1="80" x2="160" y2="80" stroke="#000" stroke-width="1"/>
</svg>