[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ritual-game"
version = "0.1.0"
description = "Simple CLI number guessing game with leaderboard"
authors = [{"name": "Hermes x tutubear"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.0.0",
    "requests>=2.31.0",
]

[project.scripts]
ritual-game = "ritual_game.cli:app"
