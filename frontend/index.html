<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ritual Number Rush</title>
    <script src="https://unpkg.com/htmx.org@1.9.6"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes pulse-glow {
            0%, 100% { box-shadow: 0 0 20px rgba(99, 102, 241, 0.5); }
            50% { box-shadow: 0 0 40px rgba(99, 102, 241, 0.8); }
        }
        .ritual-gradient {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
        }
        .game-card {
            animation: pulse-glow 3s infinite;
        }
        .btn-primary {
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            color: white;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 0.5rem;
            transition: opacity 0.2s;
        }
        .btn-primary:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body class="bg-gray-900 text-white min-h-screen">
    <!-- Header -->
    <header class="ritual-gradient p-6 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fas fa-gamepad text-2xl"></i>
                <h1 class="text-2xl font-bold">Ritual Number Rush</h1>
            </div>
            <a href="#" hx-get="/api/leaderboard?limit=10" hx-trigger="click" hx-target="#leaderboard-section"
               class="bg-white/20 hover:bg-white/30 px-4 py-2 rounded-lg transition">
                <i class="fas fa-trophy mr-2"></i>Leaderboard
            </a>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8">
        <div class="grid md:grid-cols-2 gap-8">
            <!-- Game Panel -->
            <div class="space-y-6">
                <!-- Setup Form -->
                <div id="setup-panel" class="bg-gray-800 rounded-xl p-6 shadow-xl border border-gray-700">
                    <h2 class="text-xl font-semibold mb-4 flex items-center gap-2">
                        <i class="fas fa-sliders-h text-indigo-400"></i> Game Setup
                    </h2>
                    <form hx-post="/api/start-game" hx-target="#game-panel" hx-swap="innerHTML">
                        <div class="grid grid-cols-2 gap-4 mb-4">
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Max Number</label>
                                <input type="number" name="max_number" value="100" min="10" max="1000"
                                       class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                            <div>
                                <label class="block text-sm text-gray-400 mb-1">Max Attempts</label>
                                <input type="number" name="max_attempts" value="10" min="5" max="20"
                                       class="w-full bg-gray-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
                            </div>
                        </div>
                        <button type="submit" class="w-full btn-primary">
                            <i class="fas fa-play mr-2"></i>Start New Game
                        </button>
                    </form>
                </div>

                <!-- Game Panel (hidden initially) -->
                <div id="game-panel" class="hidden">
                    <!-- Game content injected via HTMX -->
                </div>

                <!-- Score Submission -->
                <div id="score-panel" class="hidden bg-gray-800 rounded-xl p-6 shadow-xl border border-gray-700">
                    <h2 class="text-xl font-semibold mb-4 text-green-400">
                        <i class="fas fa-trophy mr-2"></i>Game Complete!
                    </h2>
                    <p class="text-3xl font-bold mb-4">Score: <span id="final-score" class="text-yellow-400">0</span></p>
                    <form hx-post="/api/submit-score" hx-target="#score-panel" hx-swap="innerHTML">
                        <input type="hidden" name="score" id="input-score">
                        <input type="hidden" name="max_number" id="input-max-number">
                        <input type="hidden" name="max_attempts" id="input-max-attempts">
                        <div class="flex gap-2">
                            <input type="text" name="name" placeholder="Your name" required
                                   class="flex-1 bg-gray-700 rounded-lg px-4 py-2 focus:ring-2 focus:ring-green-500 focus:outline-none">
                            <button type="submit" class="bg-green-600 hover:bg-green-700 px-6 py-2 rounded-lg font-semibold transition">
                                <i class="fas fa-save mr-2"></i>Save
                            </button>
                        </div>
                    </form>
                    <button onclick="shareScore()" class="mt-3 w-full bg-blue-600 hover:bg-blue-700 py-2 rounded-lg transition">
                        <i class="fab fa-twitter mr-2"></i>Share on Twitter
                    </button>
                </div>
            </div>

            <!-- Leaderboard -->
            <div id="leaderboard-section" class="bg-gray-800 rounded-xl p-6 shadow-xl border border-gray-700 h-fit">
                <div class="text-center py-8">
                    <i class="fas fa-spinner fa-spin text-3xl text-indigo-500"></i>
                    <p class="mt-2 text-gray-400">Loading leaderboard...</p>
                </div>
            </div>
        </div>

        <!-- Stats Section -->
        <div class="mt-8 grid grid-cols-3 gap-4" id="stats-section">
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center py-8 text-gray-500 text-sm">
        <p>Built for Ritual Testnet • Made with <i class="fas fa-heart text-red-500"></i> by Hermes & tutubear</p>
        <p class="mt-2"><a href="https://github.com/ritual-net/ritual" target="_blank" class="text-indigo-400 hover:underline">Ritual Network</a> • Number Rush v1.0</p>
    </footer>

    <script>
        // Load leaderboard on page load
        htmx.ajax('GET', '/api/leaderboard?limit=10', {target: '#leaderboard-section'});

        // Share score function
        function shareScore() {
            const score = document.getElementById('final-score').innerText;
            const text = `I scored ${score} points in Ritual Number Rush! Can you beat me? 🎮`;
            const url = window.location.href;
            window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(url)}`, '_blank');
        }

        // Score submitted handler
        document.body.addEventListener('htmx:afterSwap', function(evt) {
            if (evt.detail.target.id === 'score-panel' && evt.detail.success) {
                htmx.ajax('GET', '/api/leaderboard?limit=10', {target: '#leaderboard-section'});
                setTimeout(() => {
                    document.getElementById('score-panel').classList.add('hidden');
                    document.getElementById('setup-panel').classList.remove('hidden');
                }, 3000);
            }
        });
    </script>
</body>
</html>
